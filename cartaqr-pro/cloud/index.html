<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CartaQR Pro · Gestión en la nube</title><link rel="stylesheet" href="../style.css"><style>.wrap{max-width:900px;margin:30px auto;padding:20px}.hidden{display:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{border:1px solid #ddd;padding:15px;margin:12px 0;border-radius:12px}.item img{width:130px;height:100px;object-fit:cover;border-radius:8px}.hint{font-size:13px;color:#667}.row input{flex:1;min-width:160px}</style></head><body><header><a class="logo" href="../">✦ CartaQR Pro</a><span class="tag">GESTIÓN EN LA NUBE</span></header><main class="wrap"><p id="status" role="status"></p><section id="auth" class="panel"><h2>Acceso del restaurante</h2><label>Email</label><input type="email" id="email" autocomplete="email"><label>Contraseña</label><input type="password" id="password" autocomplete="current-password" minlength="8"><div class="toolbar"><button id="login">Entrar</button><button id="signup" class="secondary">Crear cuenta</button></div><p class="hint">Confirma tu correo si Supabase lo solicita.</p></section><section id="admin" class="panel hidden"><div class="heading"><h2>Mi carta pública</h2><button id="logout" class="secondary">Salir</button></div><label>Nombre del restaurante</label><input id="name" maxlength="70"><label>Descripción</label><textarea id="intro" maxlength="200"></textarea><label>Dirección pública (slug, sin espacios)</label><input id="slug" maxlength="50" pattern="[a-z0-9-]+"><h3>Productos</h3><div id="items"></div><button id="add">+ Añadir plato o bebida</button><div class="toolbar"><button id="save">Guardar y publicar</button><a id="publicLink" target="_blank" rel="noopener noreferrer"></a></div><p class="hint">Fotos JPG/PNG/WebP hasta 8 MB. Se comprimen en tu navegador. Límite inicial: 100 productos con fotografía.</p></section></main><script type="module" src="./app.js?v=20261112-2"></script></body></html>
