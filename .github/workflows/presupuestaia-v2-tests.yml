name: PresupuestaIA v2 tests
on:
  push:
    paths:
      - 'presupuesta-ia/v2/**'
      - '.github/workflows/presupuestaia-v2-tests.yml'
  pull_request:
    paths:
      - 'presupuesta-ia/v2/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v2 tests
        run: node --test presupuesta-ia/v2/tests/*.test.js
